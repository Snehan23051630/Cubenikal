<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>Cubenikal</title><link rel="stylesheet" href="style.css"></head><body><div class="controls"><label for="size">Cube size</label><select id="size"><option value="0">5 × 5 × 5</option><option value="1">7 × 7 × 7</option><option value="2">9 × 9 × 9</option><option value="3">11 × 11 × 11</option><option value="4">13 × 13 × 13</option><option value="5">15 × 15 × 15</option></select><span id="moves" aria-live="polite"></span><button id="undo" disabled>Undo (2)</button><button id="reset">Reset</button><span id="status" role="status" aria-live="polite"></span></div><canvas id="puzzle" tabindex="0" aria-label="5 by 5 by 5 steel cube puzzle. Drag to rotate, tap a block to release it, scroll or pinch to zoom. Press R for a new puzzle."></canvas><section id="run-ended" class="run-ended" role="alert" hidden><strong>Run ended</strong><p id="failure-reason"></p><button id="retry">Try again</button></section><script type="module" src="game.js"></script></body></html>
